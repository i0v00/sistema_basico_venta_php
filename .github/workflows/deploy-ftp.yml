name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # protocol: ftps          # Descomenta si usas FTPS
          # port: 21                # Cambia si usas otro puerto
          local-dir: ./             # Carpeta que quieres subir (raíz del proyecto)
          server-dir: ./public_html/ # ← Cambia esto según tu hosting
          # exclude:                # Archivos que NO quieres subir
          #   - .git/
          #   - .github/
          #   - node_modules/