name: Deploy to FTP (Automático)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files to Hosting (Automático)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # protocol: ftps          # Descomenta si usas FTPS
          local-dir: ./
          server-dir: ./htdocs/     # ← Cambia a htdocs como dijiste
          exclude: |
            .git/
            .github/
            README.md
            .gitignore