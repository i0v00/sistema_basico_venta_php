name: Deploy Full Reset (Eliminar y Subir Todo)

on:
  workflow_dispatch:  # Solo se ejecuta manualmente (no en cada push)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Get latest code
        uses: actions/checkout@v4

      - name: 🗑️ Full Reset + Deploy (Eliminar todo y subir)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # protocol: ftps        # Descomenta si usas FTPS
          local-dir: ./
          server-dir: ./htdocs/
          dangerous-clean-slate: true     
